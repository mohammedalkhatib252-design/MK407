<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>MK Racing 407</title>
<style>
  html, body { margin:0; padding:0; background:#05070a; overflow:hidden; font-family:Arial, sans-serif; touch-action:none; }
  #wrap { position:relative; width:100vw; height:100vh; display:flex; justify-content:center; align-items:center; }
  canvas { background:#101820; width:100vw; height:100vh; max-width:520px; }
  .hud { position:absolute; top:14px; left:50%; transform:translateX(-50%); width:min(92vw,480px); display:flex; justify-content:space-between; color:#fff; font-weight:700; pointer-events:none; }
  .badge { background:rgba(0,0,0,.55); padding:8px 12px; border-radius:14px; border:1px solid rgba(255,255,255,.15); }
  .controls { position:absolute; bottom:28px; left:50%; transform:translateX(-50%); width:min(92vw,480px); display:flex; justify-content:space-between; }
  button { width:42%; height:64px; border:none; border-radius:18px; font-size:30px; font-weight:900; background:rgba(255,255,255,.14); color:#fff; backdrop-filter: blur(6px); }
  #overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.72); }
  .card { width:min(86vw,400px); background:#111820; border:1px solid #2b3640; border-radius:24px; padding:26px; color:white; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.5); }
  .logo { font-size:34px; font-weight:900; color:#ffd54a; margin-bottom:8px; }
  .sub { color:#c9d0d7; margin-bottom:18px; }
  .play { width:100%; height:56px; font-size:20px; background:#e53935; }
  .small { font-size:13px; color:#98a4af; margin-top:12px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div class="hud">
    <div class="badge">🏆 <span id="score">0</span></div>
    <div class="badge">🪙 <span id="coins">0</span></div>
  </div>
  <div class="controls">
    <button id="left">◀</button>
    <button id="right">▶</button>
  </div>
  <div id="overlay">
    <div class="card">
      <div class="logo">MK RACING 407</div>
      <div class="sub">تجنّب السيارات واجمع العملات</div>
      <button class="play" id="start">ابدأ اللعب</button>
      <div class="small">استخدم الزرين يمين ويسار</div>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const coinsEl = document.getElementById('coins');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('start');

let W,H,dpr;
function resize(){
  dpr = Math.max(1, Math.min(2, window.devicePixelRatio||1));
  W = Math.min(window.innerWidth, 520);
  H = window.innerHeight;
  canvas.width = W*dpr; canvas.height = H*dpr;
  canvas.style.width = W+'px'; canvas.style.height = H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
resize(); addEventListener('resize', resize);

let playing=false, score=0, coins=0, speed=6, last=0, spawn=0, coinSpawn=0;
let roadOffset=0;
const lanes=3;
let player={lane:1, y:0, w:54, h:92};
let enemies=[], coinItems=[];

function laneX(lane){ return W*0.22 + lane*((W*0.56)/(lanes-1)); }

function reset(){
  score=0; coins=0; speed=6; enemies=[]; coinItems=[];
  player.lane=1; player.y=H-150; spawn=0; coinSpawn=0; roadOffset=0;
  scoreEl.textContent=0; coinsEl.textContent=0;
}
function start(){ reset(); overlay.style.display='none'; playing=true; last=performance.now(); requestAnimationFrame(loop); }

function move(dir){ if(!playing) return; player.lane=Math.max(0,Math.min(lanes-1,player.lane+dir)); }
document.getElementById('left').addEventListener('pointerdown',()=>move(-1));
document.getElementById('right').addEventListener('pointerdown',()=>move(1));
addEventListener('keydown',e=>{ if(e.key==='ArrowLeft') move(-1); if(e.key==='ArrowRight') move(1); });
startBtn.onclick=start;

function rects(a,b){ return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y; }

function drawRoad(){
  ctx.fillStyle='#071018'; ctx.fillRect(0,0,W,H);
  const rx=W*0.14, rw=W*0.72;
  ctx.fillStyle='#26282b'; ctx.fillRect(rx,0,rw,H);
  ctx.fillStyle='#f5c542'; ctx.fillRect(rx-5,0,4,H); ctx.fillRect(rx+rw+1,0,4,H);

  roadOffset=(roadOffset+speed)%60;
  ctx.strokeStyle='rgba(255,255,255,.65)'; ctx.lineWidth=3; ctx.setLineDash([24,30]);
  for(let i=1;i<lanes;i++){
    let x=rx + rw*i/lanes;
    ctx.beginPath(); ctx.moveTo(x,-60+roadOffset); ctx.lineTo(x,H+60); ctx.stroke();
  }
  ctx.setLineDash([]);
}

function drawCar(x,y,w,h,color){
  ctx.fillStyle=color; ctx.beginPath(); ctx.roundRect(x,y,w,h,12); ctx.fill();
  ctx.fillStyle='#111'; ctx.fillRect(x+8,y+14,w-16,h*0.34);
  ctx.fillStyle='#ffeb3b'; ctx.fillRect(x+6,y+4,10,5); ctx.fillRect(x+w-16,y+4,10,5);
  ctx.fillStyle='#ff3b30'; ctx.fillRect(x+6,y+h-9,12,5); ctx.fillRect(x+w-18,y+h-9,12,5);
}

function loop(t){
  if(!playing) return;
  const dt=Math.min(32,t-last); last=t;
  drawRoad();

  score += dt*0.01;
  speed = 6 + Math.min(8, score/180);
  scoreEl.textContent=Math.floor(score);

  spawn += dt;
  if(spawn>850){
    spawn=0;
    const lane=Math.floor(Math.random()*lanes);
    enemies.push({lane,y:-110,w:52,h:88,color:['#e53935','#1e88e5','#fdd835','#8e24aa'][Math.floor(Math.random()*4)]});
  }
  coinSpawn += dt;
  if(coinSpawn>1200){
    coinSpawn=0;
    coinItems.push({lane:Math.floor(Math.random()*lanes),y:-40,r:13});
  }

  const px=laneX(player.lane)-player.w/2;
  drawCar(px,player.y,player.w,player.h,'#050505');
  const p={x:px,y:player.y,w:player.w,h:player.h};

  for(let i=enemies.length-1;i>=0;i--){
    let e=enemies[i]; e.y+=speed;
    let ex=laneX(e.lane)-e.w/2;
    drawCar(ex,e.y,e.w,e.h,e.color);
    if(rects(p,{x:ex,y:e.y,w:e.w,h:e.h})){ gameOver(); return; }
    if(e.y>H+120) enemies.splice(i,1);
  }

  for(let i=coinItems.length-1;i>=0;i--){
    let c=coinItems[i]; c.y+=speed*0.9; let cx=laneX(c.lane);
    ctx.fillStyle='#ffcf33'; ctx.beginPath(); ctx.arc(cx,c.y,c.r,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#7a5200'; ctx.font='bold 14px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('M',cx,c.y+1);
    if(rects(p,{x:cx-c.r,y:c.y-c.r,w:c.r*2,h:c.r*2})){ coins++; coinsEl.textContent=coins; coinItems.splice(i,1); }
    else if(c.y>H+40) coinItems.splice(i,1);
  }
  requestAnimationFrame(loop);
}

function gameOver(){
  playing=false;
  overlay.style.display='flex';
  document.querySelector('.logo').textContent='GAME OVER';
  document.querySelector('.sub').innerHTML=`النقاط: <b>${Math.floor(score)}</b> &nbsp; | &nbsp; العملات: <b>${coins}</b>`;
  startBtn.textContent='إعادة اللعب';
}
</script>
</body>
</html>
